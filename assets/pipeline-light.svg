<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1600" role="img"
           aria-label="Flowchart of the brain tumor detection pipeline: an uploaded MRI is preprocessed, expanded into five test-time augmentations, classified by three CNNs in parallel, then the best model feeds explainability, uncertainty, robustness and out-of-distribution checks; Grad-CAM output drives a YOLO and MobileSAM localization chain that produces a malignancy score, which is cross-checked by a focus crop and by MedGemma before the response is assembled. Five checks feed a shared needs-review flag.">
<style>
  .nd{stroke-width:1.25}
  .nd-io{fill:#EDF0F2;stroke:#55626E}
  .nd-model{fill:#E3F1F1;stroke:#0C7079}
  .nd-check{fill:#F4EEDF;stroke:#8A6410}
  .nd-llm{fill:#EFEBF6;stroke:#5F4A93}
  .nd-gate{fill:#F4EEDF;stroke:#8A6410;stroke-width:2}
  .t-lbl{font-family:'Segoe UI',Roboto,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:14px;fill:#101519;text-anchor:middle}
  .t-sub{font-family:'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace;font-size:10.5px;fill:#4B5763;text-anchor:middle}
  .t-edge{font-family:'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace;font-size:10px;fill:#7E8A95;text-anchor:middle}
  .t-edge-l{text-anchor:start}
  .t-flag{font-family:'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace;font-size:10px;fill:#8A6410;text-anchor:middle;font-weight:500}
  .t-band{font-family:'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace;font-size:10px;letter-spacing:.12em;fill:#7E8A95;text-anchor:start}
  .ed{stroke:#7E8A95;stroke-width:1.2;fill:none}
  .ed-soft{stroke:#7E8A95;stroke-width:1.1;fill:none;stroke-dasharray:4 3;opacity:.75}
  .ed-rail{stroke:#8A6410;stroke-width:1.4;fill:none}
  .ed-loop{stroke:#55626E;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
</style>
<rect x="0" y="0" width="1360" height="1600" fill="#ffffff"/>

        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="#7E8A95"/>
          </marker>
          <marker id="ah-rail" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="#8A6410"/>
          </marker>
          <marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="#55626E"/>
          </marker>
        </defs>

        <!-- ============ 01 INPUT ============ -->
        <text class="t-band" x="1240" y="62">01 INPUT</text>
        <rect rx="3" class="nd nd-io" x="465" y="30" width="220" height="56"/>
        <text class="t-lbl" x="575" y="55">MRI slice</text>
        <text class="t-sub" x="575" y="73">PNG · JPG</text>

        <line class="ed" x1="575" y1="86" x2="575" y2="120" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="586" y="107">multipart/form-data</text>

        <rect rx="3" class="nd nd-io" x="425" y="124" width="300" height="56"/>
        <text class="t-lbl" x="575" y="149">POST /api/predict</text>
        <text class="t-sub" x="575" y="167">guard · ≤20 MB · decodable</text>

        <line class="ed" x1="575" y1="180" x2="575" y2="214" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="586" y="201">else → 400</text>

        <!-- ============ 02 PREPROCESS ============ -->
        <text class="t-band" x="1240" y="250">02 PREPROCESS</text>
        <rect rx="3" class="nd nd-io" x="385" y="218" width="380" height="74"/>
        <text class="t-lbl" x="575" y="243">Preprocess</text>
        <text class="t-sub" x="575" y="262">CLAHE 2.0 · 8×8 on LAB-L</text>
        <text class="t-sub" x="575" y="279">→ 224×224 → ImageNet norm</text>

        <line class="ed" x1="575" y1="292" x2="575" y2="326" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="586" y="313">tensor (1,3,224,224)</text>

        <!-- original-image bypass -->
        <path class="ed-soft" d="M385,255 L16,255 L16,854 L24,854" marker-end="url(#ah-soft)"/>
        <path class="ed-soft" d="M16,1068 L24,1068" marker-end="url(#ah-soft)"/>
        <text class="t-edge t-edge-l" x="26" y="248">original PIL — un-normalized</text>

        <!-- ============ 03 TTA ============ -->
        <text class="t-band" x="1240" y="362">03 AUGMENT</text>
        <rect rx="3" class="nd nd-io" x="435" y="330" width="280" height="56"/>
        <text class="t-lbl" x="575" y="355">TTA × 5</text>
        <text class="t-sub" x="575" y="373">orig · hflip · ±5° · ×1.05</text>

        <path class="ed" d="M575,386 L575,406 M200,406 L950,406 M200,406 L200,422 M575,406 L575,422 M950,406 L950,422"/>
        <path class="ed" d="M200,414 L200,424 M575,414 L575,424 M950,414 L950,424" marker-end="url(#ah)"/>

        <!-- ============ 04 ENSEMBLE ============ -->
        <text class="t-band" x="1240" y="460">04 ENSEMBLE</text>
        <rect rx="3" class="nd nd-model" x="30" y="428" width="340" height="92"/>
        <text class="t-lbl" x="200" y="454">ConvNeXt-Tiny</text>
        <text class="t-sub" x="200" y="476">1 clean pass → E(x)</text>
        <text class="t-sub" x="200" y="496">TTA×5 → mean softmax</text>

        <rect rx="3" class="nd nd-model" x="405" y="428" width="340" height="92"/>
        <text class="t-lbl" x="575" y="454">EfficientNet-B3</text>
        <text class="t-sub" x="575" y="476">1 clean pass → E(x)</text>
        <text class="t-sub" x="575" y="496">TTA×5 → mean softmax</text>

        <rect rx="3" class="nd nd-model" x="780" y="428" width="340" height="92"/>
        <text class="t-lbl" x="950" y="454">ResNet-50</text>
        <text class="t-sub" x="950" y="476">1 clean pass → E(x)</text>
        <text class="t-sub" x="950" y="496">TTA×5 → mean softmax</text>

        <path class="ed" d="M200,520 L200,544 M575,520 L575,544 M950,520 L950,544 M200,544 L1120,544"/>
        <line class="ed" x1="575" y1="544" x2="575" y2="562" marker-end="url(#ah)"/>
        <path class="ed" d="M975,544 L975,562" marker-end="url(#ah)"/>

        <rect rx="3" class="nd nd-io" x="405" y="566" width="340" height="56"/>
        <text class="t-lbl" x="575" y="591">Best model</text>
        <text class="t-sub" x="575" y="609">argmax(TTA confidence)</text>

        <rect rx="3" class="nd nd-check" x="830" y="566" width="290" height="56"/>
        <text class="t-lbl" x="975" y="591">3-way agreement</text>
        <text class="t-sub" x="975" y="609">unanimous?</text>

        <!-- agreement → rail -->
        <path class="ed-rail" d="M1120,594 L1180,594"/>
        <text class="t-flag" x="1150" y="586">flag</text>

        <path class="ed" d="M575,622 L575,644 M155,644 L995,644 M155,644 L155,662 M435,644 L435,662 M715,644 L715,662 M995,644 L995,662"/>
        <path class="ed" d="M155,654 L155,664 M435,654 L435,664 M715,654 L715,664 M995,654 L995,664" marker-end="url(#ah)"/>

        <!-- ============ 05 ANALYSE ============ -->
        <text class="t-band" x="1240" y="700">05 ANALYSE</text>
        <rect rx="3" class="nd nd-model" x="30" y="668" width="250" height="92"/>
        <text class="t-lbl" x="155" y="694">Hierarchical XAI</text>
        <text class="t-sub" x="155" y="716">Grad-CAM · CAM++</text>
        <text class="t-sub" x="155" y="736">LayerCAM ×2 → L1–L4</text>

        <rect rx="3" class="nd nd-model" x="310" y="668" width="250" height="92"/>
        <text class="t-lbl" x="435" y="694">MC Dropout</text>
        <text class="t-sub" x="435" y="716">T = 20 passes</text>
        <text class="t-sub" x="435" y="736">epistemic · aleatoric</text>

        <rect rx="3" class="nd nd-check" x="590" y="668" width="250" height="92"/>
        <text class="t-lbl" x="715" y="694">Robustness</text>
        <text class="t-sub" x="715" y="716">blur · noise · Rician</text>
        <text class="t-sub" x="715" y="736">CAM cosine + pred</text>

        <rect rx="3" class="nd nd-check" x="870" y="668" width="250" height="92"/>
        <text class="t-lbl" x="995" y="694">Energy OOD</text>
        <text class="t-sub" x="995" y="716">E(x) = −logsumexp</text>
        <text class="t-sub" x="995" y="736">vs p95 threshold</text>

        <!-- collector into rail -->
        <path class="ed-rail" d="M435,760 L435,784 M715,760 L715,784 M995,760 L995,784 M435,784 L1180,784"/>
        <text class="t-flag" x="1150" y="777">flag ×3</text>

        <!-- XAI → localization chain -->
        <line class="ed" x1="155" y1="760" x2="155" y2="814" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="166" y="794">Grad-CAM++ seed</text>

        <!-- ============ 06 LOCALIZE ============ -->
        <text class="t-band" x="1240" y="852">06 LOCALIZE</text>
        <rect rx="3" class="nd nd-model" x="30" y="820" width="250" height="68"/>
        <text class="t-lbl" x="155" y="847">YOLO11n</text>
        <text class="t-sub" x="155" y="866">mAP50 0.918</text>

        <rect rx="3" class="nd nd-model" x="310" y="820" width="250" height="68"/>
        <text class="t-lbl" x="435" y="847">MobileSAM</text>
        <text class="t-sub" x="435" y="866">bbox-prompted mask</text>

        <rect rx="3" class="nd nd-check" x="590" y="820" width="250" height="68"/>
        <text class="t-lbl" x="715" y="847">Area check</text>
        <text class="t-sub" x="715" y="866">plausible 0.30–0.90</text>

        <rect rx="3" class="nd nd-io" x="870" y="820" width="250" height="68"/>
        <text class="t-lbl" x="995" y="847">Malignancy</text>
        <text class="t-sub" x="995" y="866">base × size × conf</text>

        <line class="ed" x1="280" y1="854" x2="304" y2="854" marker-end="url(#ah)"/>
        <text class="t-edge" x="292" y="812">bbox</text>
        <line class="ed" x1="560" y1="854" x2="584" y2="854" marker-end="url(#ah)"/>
        <text class="t-edge" x="572" y="812">mask</text>
        <line class="ed" x1="840" y1="854" x2="864" y2="854" marker-end="url(#ah)"/>
        <text class="t-edge" x="852" y="812">size %</text>

        <!-- ============ 07 SELF-CHECK ============ -->
        <text class="t-band" x="1240" y="954">07 SELF-CHECK</text>
        <path class="ed" d="M995,888 L995,904 L575,904 L575,916" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="586" y="901">bbox</text>

        <rect rx="3" class="nd nd-check" x="405" y="922" width="340" height="56"/>
        <text class="t-lbl" x="575" y="947">Focus-crop re-check</text>
        <text class="t-sub" x="575" y="965">crop to bbox → re-classify</text>

        <path class="ed-rail" d="M575,996 L1180,996"/>
        <text class="t-flag" x="1150" y="989">flag</text>

        <path class="ed" d="M575,978 L575,1010 L200,1010 L200,1024" marker-end="url(#ah)"/>

        <!-- ============ 08 CROSS-CHECK ============ -->
        <text class="t-band" x="1240" y="1062">08 CROSS-CHECK</text>
        <rect rx="3" class="nd nd-llm" x="30" y="1030" width="340" height="76"/>
        <text class="t-lbl" x="200" y="1056">MedGemma 1.5 4B</text>
        <text class="t-sub" x="200" y="1075">vision · size · bbox_norm</text>
        <text class="t-sub" x="200" y="1094">via Ollama, local CPU</text>

        <rect rx="3" class="nd nd-model" x="405" y="1030" width="340" height="76"/>
        <text class="t-lbl" x="575" y="1056">Multi-strategy SAM</text>
        <text class="t-sub" x="575" y="1075">4 prompts · top-3 CAM peaks</text>
        <text class="t-sub" x="575" y="1094">best intensity contrast wins</text>

        <rect rx="3" class="nd nd-io" x="780" y="1030" width="340" height="76"/>
        <text class="t-lbl" x="950" y="1056">Size trust ladder</text>
        <text class="t-sub" x="950" y="1075">YOLO px → MG-SAM px</text>
        <text class="t-sub" x="950" y="1094">→ MG free text</text>

        <line class="ed" x1="370" y1="1068" x2="399" y2="1068" marker-end="url(#ah)"/>
        <line class="ed" x1="745" y1="1068" x2="774" y2="1068" marker-end="url(#ah)"/>

        <path class="ed" d="M950,1106 L950,1126 L575,1126 L575,1144" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="586" y="1123">rescored</text>

        <!-- ============ 09 GATE + RESPONSE ============ -->
        <text class="t-band" x="1240" y="1184">09 GATE</text>
        <path class="ed-rail" d="M1180,594 L1180,1190 L811,1190" marker-end="url(#ah-rail)"/>

        <rect rx="3" class="nd nd-gate" x="345" y="1150" width="460" height="80"/>
        <text class="t-lbl" x="575" y="1177">needs_review</text>
        <text class="t-sub" x="575" y="1196">OR of every flag on the rail</text>
        <text class="t-sub" x="575" y="1215">→ drives the UI trust banner</text>

        <line class="ed" x1="575" y1="1230" x2="575" y2="1266" marker-end="url(#ah)"/>

        <rect rx="3" class="nd nd-io" x="405" y="1272" width="340" height="56"/>
        <text class="t-lbl" x="575" y="1297">JSON response</text>
        <text class="t-sub" x="575" y="1315">13 top-level blocks</text>

        <line class="ed" x1="575" y1="1328" x2="575" y2="1356" marker-end="url(#ah)"/>

        <rect rx="3" class="nd nd-io" x="405" y="1362" width="340" height="56"/>
        <text class="t-lbl" x="575" y="1387">React UI renders</text>
        <text class="t-sub" x="575" y="1405">EN / ES</text>

        <path class="ed" d="M575,1418 L575,1440 M200,1440 L950,1440 M200,1440 L200,1456 M575,1440 L575,1456 M950,1440 L950,1456"/>
        <path class="ed" d="M200,1448 L200,1458 M575,1448 L575,1458 M950,1448 L950,1458" marker-end="url(#ah)"/>

        <!-- ============ ON DEMAND ============ -->
        <text class="t-band" x="1240" y="1494">ON DEMAND</text>
        <rect rx="3" class="nd nd-llm" x="30" y="1462" width="340" height="72"/>
        <text class="t-lbl" x="200" y="1488">/api/explain</text>
        <text class="t-sub" x="200" y="1507">diagnostic report</text>
        <text class="t-sub" x="200" y="1524">basic / advanced</text>

        <rect rx="3" class="nd nd-llm" x="405" y="1462" width="340" height="72"/>
        <text class="t-lbl" x="575" y="1488">/api/chat</text>
        <text class="t-sub" x="575" y="1507">scan-aware Q&amp;A</text>
        <text class="t-sub" x="575" y="1524">patient / doctor voice</text>

        <rect rx="3" class="nd nd-io" x="780" y="1462" width="340" height="72"/>
        <text class="t-lbl" x="950" y="1488">/api/predict_manual_bbox</text>
        <text class="t-sub" x="950" y="1507">user redraws the box</text>
        <text class="t-sub" x="950" y="1524">→ re-measure</text>

        <path class="ed-loop" d="M1120,1498 L1216,1498 L1216,854 L1126,854" marker-end="url(#ah-soft)"/>
      </svg>
