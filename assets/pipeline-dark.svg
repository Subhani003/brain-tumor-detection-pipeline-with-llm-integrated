<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1690" role="img"
           aria-label="Flowchart of the brain tumor detection pipeline: an uploaded MRI is preprocessed, expanded into five test-time augmentations, and classified by three CNNs in parallel. The best model feeds explainability, uncertainty, robustness and out-of-distribution checks; the Grad-CAM++ output seeds a YOLO and MobileSAM localization chain that produces a malignancy score, which is cross-checked by a focus crop and by MedGemma before the response is assembled. Five independent checks feed a shared needs-review flag.">
<style>
  .nd{stroke-width:1.25}
  .nd-io{fill:#1B2126;stroke:#93A0AC}
  .nd-model{fill:#12292B;stroke:#3FB3BC}
  .nd-check{fill:#282218;stroke:#D8A845}
  .nd-llm{fill:#221E2E;stroke:#A98CD8}
  .nd-gate{fill:#282218;stroke:#D8A845;stroke-width:2}
  .t-lbl{font-family:'Segoe UI',Roboto,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:15px;fill:#E3E8EC;text-anchor:middle}
  .t-sub{font-family:'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace;font-size:12px;fill:#98A4AF;text-anchor:middle}
  .t-edge{font-family:'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace;font-size:11px;fill:#6A757F;text-anchor:middle}
  .t-edge-l{text-anchor:start}
  .t-flag{font-family:'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace;font-size:10.5px;fill:#D8A845;text-anchor:end;font-weight:500}
  .t-band{font-family:'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace;font-size:10px;letter-spacing:.12em;fill:#6A757F;text-anchor:start}
  .ed{stroke:#6A757F;stroke-width:1.2;fill:none}
  .ed-soft{stroke:#6A757F;stroke-width:1.1;fill:none;stroke-dasharray:4 3;opacity:.75}
  .ed-rail{stroke:#D8A845;stroke-width:1.4;fill:none}
  .ed-loop{stroke:#93A0AC;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
</style>
<rect x="0" y="0" width="900" height="1690" fill="#0d1117"/>

        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="#6A757F"/>
          </marker>
          <marker id="ah-rail" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="#D8A845"/>
          </marker>
          <marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="#93A0AC"/>
          </marker>
        </defs>

        <!-- ============ INPUT ============ -->
        <rect rx="3" class="nd nd-io" x="320" y="26" width="220" height="62"/>
        <text class="t-lbl" x="430" y="52">MRI slice</text>
        <text class="t-sub" x="430" y="72">PNG · JPG</text>

        <line class="ed" x1="430" y1="88" x2="430" y2="120" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="441" y="109">multipart/form-data</text>

        <rect rx="3" class="nd nd-io" x="270" y="126" width="320" height="62"/>
        <text class="t-lbl" x="430" y="152">POST /api/predict</text>
        <text class="t-sub" x="430" y="172">guard · ≤20 MB · decodable</text>

        <line class="ed" x1="430" y1="188" x2="430" y2="220" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="441" y="209">else → 400</text>

        <!-- ============ PREPROCESS ============ -->
        <rect rx="3" class="nd nd-io" x="240" y="226" width="380" height="82"/>
        <text class="t-lbl" x="430" y="252">Preprocess</text>
        <text class="t-sub" x="430" y="273">CLAHE 2.0 · 8×8 on LAB-L</text>
        <text class="t-sub" x="430" y="292">→ 224×224 → ImageNet norm</text>

        <line class="ed" x1="430" y1="308" x2="430" y2="340" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="441" y="329">tensor (1,3,224,224)</text>

        <!-- original-image bypass -->
        <path class="ed-soft" d="M240,267 L12,267 L12,891 L18,891" marker-end="url(#ah-soft)"/>
        <path class="ed-soft" d="M12,1125 L18,1125" marker-end="url(#ah-soft)"/>
        <text class="t-edge t-edge-l" x="22" y="257">original PIL — un-normalized</text>

        <!-- ============ AUGMENT ============ -->
        <rect rx="3" class="nd nd-io" x="290" y="346" width="280" height="62"/>
        <text class="t-lbl" x="430" y="372">TTA × 5</text>
        <text class="t-sub" x="430" y="392">orig · hflip · ±5° · ×1.05</text>

        <path class="ed" d="M430,408 L430,428 M151,428 L709,428 M151,428 L151,444 M430,428 L430,444 M709,428 L709,444"/>
        <path class="ed" d="M151,436 L151,446 M430,436 L430,446 M709,436 L709,446" marker-end="url(#ah)"/>

        <!-- ============ ENSEMBLE ============ -->
        <rect rx="3" class="nd nd-model" x="24" y="450" width="254" height="96"/>
        <text class="t-lbl" x="151" y="478">ConvNeXt-Tiny</text>
        <text class="t-sub" x="151" y="501">1 clean pass → E(x)</text>
        <text class="t-sub" x="151" y="523">TTA×5 → mean softmax</text>

        <rect rx="3" class="nd nd-model" x="303" y="450" width="254" height="96"/>
        <text class="t-lbl" x="430" y="478">EfficientNet-B3</text>
        <text class="t-sub" x="430" y="501">1 clean pass → E(x)</text>
        <text class="t-sub" x="430" y="523">TTA×5 → mean softmax</text>

        <rect rx="3" class="nd nd-model" x="582" y="450" width="254" height="96"/>
        <text class="t-lbl" x="709" y="478">ResNet-50</text>
        <text class="t-sub" x="709" y="501">1 clean pass → E(x)</text>
        <text class="t-sub" x="709" y="523">TTA×5 → mean softmax</text>

        <path class="ed" d="M151,546 L151,572 M430,546 L430,572 M709,546 L709,572 M151,572 L836,572"/>
        <line class="ed" x1="430" y1="572" x2="430" y2="590" marker-end="url(#ah)"/>
        <path class="ed" d="M723,572 L723,590" marker-end="url(#ah)"/>

        <rect rx="3" class="nd nd-io" x="303" y="596" width="254" height="62"/>
        <text class="t-lbl" x="430" y="622">Best model</text>
        <text class="t-sub" x="430" y="642">argmax(TTA confidence)</text>

        <rect rx="3" class="nd nd-check" x="610" y="596" width="226" height="62"/>
        <text class="t-lbl" x="723" y="622">3-way agreement</text>
        <text class="t-sub" x="723" y="642">unanimous?</text>

        <path class="ed-rail" d="M836,627 L868,627"/>
        <text class="t-flag" x="864" y="618">flag</text>

        <path class="ed" d="M430,658 L430,680 M118,680 L742,680 M118,680 L118,698 M326,680 L326,698 M534,680 L534,698 M742,680 L742,698"/>
        <path class="ed" d="M118,690 L118,700 M326,690 L326,700 M534,690 L534,700 M742,690 L742,700" marker-end="url(#ah)"/>

        <!-- ============ ANALYSE ============ -->
        <rect rx="3" class="nd nd-model" x="24" y="704" width="188" height="96"/>
        <text class="t-lbl" x="118" y="732">Hierarchical XAI</text>
        <text class="t-sub" x="118" y="755">Grad-CAM · CAM++</text>
        <text class="t-sub" x="118" y="777">LayerCAM → L1–L4</text>

        <rect rx="3" class="nd nd-model" x="232" y="704" width="188" height="96"/>
        <text class="t-lbl" x="326" y="732">MC Dropout</text>
        <text class="t-sub" x="326" y="755">T = 20 passes</text>
        <text class="t-sub" x="326" y="777">epistemic · aleatoric</text>

        <rect rx="3" class="nd nd-check" x="440" y="704" width="188" height="96"/>
        <text class="t-lbl" x="534" y="732">Robustness</text>
        <text class="t-sub" x="534" y="755">blur · noise · Rician</text>
        <text class="t-sub" x="534" y="777">CAM cosine + pred</text>

        <rect rx="3" class="nd nd-check" x="648" y="704" width="188" height="96"/>
        <text class="t-lbl" x="742" y="732">Energy OOD</text>
        <text class="t-sub" x="742" y="755">E(x) = −logsumexp</text>
        <text class="t-sub" x="742" y="777">vs p95 threshold</text>

        <path class="ed-rail" d="M326,800 L326,826 M534,800 L534,826 M742,800 L742,826 M326,826 L868,826"/>
        <text class="t-flag" x="864" y="817">flag ×3</text>

        <line class="ed" x1="118" y1="800" x2="118" y2="852" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="129" y="833">Grad-CAM++ seed</text>

        <!-- ============ LOCALIZE ============ -->
        <rect rx="3" class="nd nd-model" x="24" y="858" width="188" height="66"/>
        <text class="t-lbl" x="118" y="886">YOLO11n</text>
        <text class="t-sub" x="118" y="906">mAP50 0.918</text>

        <rect rx="3" class="nd nd-model" x="232" y="858" width="188" height="66"/>
        <text class="t-lbl" x="326" y="886">MobileSAM</text>
        <text class="t-sub" x="326" y="906">bbox-prompted mask</text>

        <rect rx="3" class="nd nd-check" x="440" y="858" width="188" height="66"/>
        <text class="t-lbl" x="534" y="886">Area check</text>
        <text class="t-sub" x="534" y="906">plausible 0.30–0.90</text>

        <rect rx="3" class="nd nd-io" x="648" y="858" width="188" height="66"/>
        <text class="t-lbl" x="742" y="886">Malignancy</text>
        <text class="t-sub" x="742" y="906">base × size × conf</text>

        <line class="ed" x1="212" y1="891" x2="226" y2="891" marker-end="url(#ah)"/>
        <text class="t-edge" x="222" y="850">bbox</text>
        <line class="ed" x1="420" y1="891" x2="434" y2="891" marker-end="url(#ah)"/>
        <text class="t-edge" x="430" y="850">mask</text>
        <line class="ed" x1="628" y1="891" x2="642" y2="891" marker-end="url(#ah)"/>
        <text class="t-edge" x="638" y="850">size %</text>

        <!-- ============ SELF-CHECK ============ -->
        <path class="ed" d="M742,924 L742,940 L430,940 L430,958" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="441" y="936">bbox</text>

        <rect rx="3" class="nd nd-check" x="303" y="964" width="254" height="62"/>
        <text class="t-lbl" x="430" y="990">Focus-crop re-check</text>
        <text class="t-sub" x="430" y="1010">crop to bbox → re-classify</text>

        <path class="ed-rail" d="M430,1048 L868,1048"/>
        <text class="t-flag" x="864" y="1039">flag</text>

        <path class="ed" d="M430,1026 L430,1060 L151,1060 L151,1074" marker-end="url(#ah)"/>

        <!-- ============ CROSS-CHECK ============ -->
        <rect rx="3" class="nd nd-llm" x="24" y="1080" width="254" height="90"/>
        <text class="t-lbl" x="151" y="1108">MedGemma 1.5 4B</text>
        <text class="t-sub" x="151" y="1130">vision · size · bbox_norm</text>
        <text class="t-sub" x="151" y="1151">via Ollama, local CPU</text>

        <rect rx="3" class="nd nd-model" x="303" y="1080" width="254" height="90"/>
        <text class="t-lbl" x="430" y="1108">Multi-strategy SAM</text>
        <text class="t-sub" x="430" y="1130">4 prompts · top-3 peaks</text>
        <text class="t-sub" x="430" y="1151">best contrast wins</text>

        <rect rx="3" class="nd nd-io" x="582" y="1080" width="254" height="90"/>
        <text class="t-lbl" x="709" y="1108">Size trust ladder</text>
        <text class="t-sub" x="709" y="1130">YOLO px → MG-SAM px</text>
        <text class="t-sub" x="709" y="1151">→ MG free text</text>

        <line class="ed" x1="278" y1="1125" x2="297" y2="1125" marker-end="url(#ah)"/>
        <line class="ed" x1="557" y1="1125" x2="576" y2="1125" marker-end="url(#ah)"/>

        <path class="ed" d="M709,1170 L709,1192 L430,1192 L430,1208" marker-end="url(#ah)"/>
        <text class="t-edge t-edge-l" x="441" y="1188">rescored</text>

        <!-- ============ GATE + RESPONSE ============ -->
        <path class="ed-rail" d="M868,627 L868,1257 L626,1257" marker-end="url(#ah-rail)"/>

        <rect rx="3" class="nd nd-gate" x="240" y="1214" width="380" height="86"/>
        <text class="t-lbl" x="430" y="1243">needs_review</text>
        <text class="t-sub" x="430" y="1265">OR of every flag on the rail</text>
        <text class="t-sub" x="430" y="1286">→ drives the UI trust banner</text>

        <line class="ed" x1="430" y1="1300" x2="430" y2="1334" marker-end="url(#ah)"/>

        <rect rx="3" class="nd nd-io" x="303" y="1340" width="254" height="62"/>
        <text class="t-lbl" x="430" y="1366">JSON response</text>
        <text class="t-sub" x="430" y="1386">13 top-level blocks</text>

        <line class="ed" x1="430" y1="1402" x2="430" y2="1436" marker-end="url(#ah)"/>

        <rect rx="3" class="nd nd-io" x="303" y="1442" width="254" height="62"/>
        <text class="t-lbl" x="430" y="1468">React UI renders</text>
        <text class="t-sub" x="430" y="1488">EN / ES</text>

        <path class="ed" d="M430,1504 L430,1524 M151,1524 L709,1524 M151,1524 L151,1538 M430,1524 L430,1538 M709,1524 L709,1538"/>
        <path class="ed" d="M151,1530 L151,1540 M430,1530 L430,1540 M709,1530 L709,1540" marker-end="url(#ah)"/>

        <!-- ============ ON DEMAND ============ -->
        <rect rx="3" class="nd nd-llm" x="24" y="1544" width="254" height="88"/>
        <text class="t-lbl" x="151" y="1572">/api/explain</text>
        <text class="t-sub" x="151" y="1594">diagnostic report</text>
        <text class="t-sub" x="151" y="1615">basic / advanced</text>

        <rect rx="3" class="nd nd-llm" x="303" y="1544" width="254" height="88"/>
        <text class="t-lbl" x="430" y="1572">/api/chat</text>
        <text class="t-sub" x="430" y="1594">scan-aware Q&amp;A</text>
        <text class="t-sub" x="430" y="1615">patient / doctor voice</text>

        <rect rx="3" class="nd nd-io" x="582" y="1544" width="254" height="88"/>
        <text class="t-lbl" x="709" y="1572">/api/predict_manual_bbox</text>
        <text class="t-sub" x="709" y="1594">user redraws the box</text>
        <text class="t-sub" x="709" y="1615">→ re-measure</text>
      </svg>
